<html>
    <head><title>Greeting</title>
    <style>
        body {
            background-image: url('thankyou.jpg');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }
        h1 {
            margin-top: 100px;
            text-align: center;
            font-size: 30px;
            font-family:'Courier New', Courier, monospace;
            color: white;
            text-shadow: 0 0 5px #fff,
            0 0 10px #fff,
            0 0 20px rgb(247, 53, 218),
            0 0 30px rgb(221, 25, 175),
            0 0 40px rgb(223, 18, 141),
            0 0 55px rgb(247, 53, 192),
            0 0 70px rgb(235, 45, 219);
        }
        h2 {
            margin-top: 50px;
            text-align: center;
            font-size: 45px;
            color: #f01ccc;
            text-shadow: 0 0 5px #fff,
            0 0 10px #fff,
            0 0 20px aqua,
            0 0 30px aqua,
            0 0 40px aqua,
            0 0 55px aqua,
            0 0 70px aqua;
        }
        .mybutton {
  padding: 0.6em 2em;
  border: none;
  outline: none;
  color: rgb(255, 255, 255);
  background: #111;
  cursor: pointer;
  position: relative;
  z-index: 0;
  border-radius: 10px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

.mybutton:before {
  content: "";
  background: linear-gradient(
    45deg,
    #ff0000,
    #ff7300,
    #fffb00,
    #48ff00,
    #00ffd5,
    #002bff,
    #7a00ff,
    #ff00c8,
    #ff0000
  );
  position: absolute;
  top: -2px;
  left: -2px;
  background-size: 400%;
  z-index: -1;
  filter: blur(5px);
  -webkit-filter: blur(5px);
  width: calc(100% + 4px);
  height: calc(100% + 4px);
  animation: glowing-mybutton 20s linear infinite;
  transition: opacity 0.3s ease-in-out;
  border-radius: 10px;
}

@keyframes glowing-mybutton {
  0% {
    background-position: 0 0;
  }
  50% {
    background-position: 400% 0;
  }
  100% {
    background-position: 0 0;
  }
}

.mybutton:after {
  z-index: -1;
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: #222;
  left: 0;
  top: 0;
  border-radius: 10px;
}
</style></head>
<body>
  <h1>"YOUR REGISTRATION WAS SUCCESSFUL"
  <h2>THANK YOU</h2></h1>
</body>
<center><button class="mybutton" role="button" onclick = "window.location.href='loginnew.html';">Continue to Login</button></center>
</html>
